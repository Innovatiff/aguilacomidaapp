# Publishes the farm app on every push.
#
# Firestore rules are not deployed from here — they live in
# aguilacomidasoftware and are published by that repository's workflow, so the
# two copies cannot drift apart.
#
# One-time setup — see README, "Publicar desde GitHub":
#   1. Firebase console → Project settings → Service accounts →
#      Generate new private key. A .json file downloads.
#   2. This repo → Settings → Secrets and variables → Actions →
#      New repository secret, named FIREBASE_SERVICE_ACCOUNT,
#      with the whole contents of that file pasted in.

name: Publicar

on:
  push:
    branches:
      - claude/el-aguila-cocina-app-yo40te
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:        # lets you publish by hand from the Actions tab

concurrency:
  group: deploy-clientes
  cancel-in-progress: true

jobs:
  publicar:
    name: App de los ranchos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: Preparar credenciales
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT. Ver las instrucciones al inicio de este archivo."
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Publicar la app
        run: firebase deploy --only hosting:clientes --project aguilacocina-24496 --non-interactive

      - name: Limpiar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
